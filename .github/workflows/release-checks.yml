name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  production-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install production dependencies and build
        run: |
          npm ci --omit=dev
          npm run build
      - name: Start compiled server, check health, and shut down
        env:
          BASE_RPC_URL: https://example.invalid
          PORT: "3000"
        run: |
          set -euo pipefail
          npm start > /tmp/watchtower-start.log 2>&1 &
          npm_pid=$!
          node_pid=""
          cleanup() {
            if [[ -n "$node_pid" ]] && kill -0 "$node_pid" 2>/dev/null; then
              kill -TERM "$node_pid" 2>/dev/null || true
            fi
            if kill -0 "$npm_pid" 2>/dev/null; then
              kill -TERM "$npm_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          healthy=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/watchtower-health.json; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then
            cat /tmp/watchtower-start.log
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/watchtower-health.json

          node_pid="$(ps -eo pid=,args= | awk '/[n]ode .*dist\/server\/main\.js/ { print $1; exit }')"
          test -n "$node_pid"
          kill -TERM "$node_pid"

          for _ in {1..40}; do
            if ! kill -0 "$npm_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if kill -0 "$npm_pid" 2>/dev/null; then
            echo "npm start did not exit after the intentional SIGTERM."
            exit 1
          fi

          set +e
          wait "$npm_pid"
          npm_status=$?
          set -e
          if [[ "$npm_status" -ne 0 && "$npm_status" -ne 143 ]]; then
            echo "npm start exited unexpectedly with status $npm_status."
            cat /tmp/watchtower-start.log
            exit 1
          fi

          if kill -0 "$node_pid" 2>/dev/null; then
            echo "Compiled Watchtower process did not shut down."
            exit 1
          fi

          node --input-type=module -e '
            import net from "node:net";
            const probe = net.createServer();
            probe.once("error", () => process.exit(1));
            probe.listen(3000, "127.0.0.1", () => probe.close((error) => process.exit(error ? 1 : 0)));
          '
          trap - EXIT
