name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  production-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install production dependencies and build
        run: |
          npm ci --omit=dev
          npm run build
      - name: Smoke test compiled portable integrity export and offline verification
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { archiveProfiles } from "./public/archive-data.js";
          import { buildFixtureDetail } from "./public/view-model.js";
          import { createPortableArtifact, createPortableAlertId, verifyPortableIntegrityArtifact } from "./public/portable-integrity-verifier.js";
          import { scanResultSchema } from "./dist/domain/schemas.js";
          import { createScanId } from "./dist/pipeline/ids.js";
          import { getTargetProfile } from "./dist/profiles/registry.js";
          import { createApp } from "./dist/server/app.js";
          import { listenForRequests } from "./dist/server/main.js";
          import { ScanStore } from "./dist/server/store.js";

          const profile = archiveProfiles.find(({ id }) => id === "etherfi-base-weeth-oft");
          const detail = buildFixtureDetail(profile);
          const scanId = createScanId(8453, profile.id, BigInt(profile.block.number), BigInt(profile.block.number));
          const alertId = await createPortableAlertId(8453, detail.evidence.transaction.hash, detail.evidence.log.index, detail.evidence.detector.id);
          const scan = scanResultSchema.parse({
            scanId,
            targetId: profile.id,
            range: { fromBlock: profile.block.number, toBlock: profile.block.number },
            status: "complete",
            alerts: [{
              ...detail.alert,
              id: alertId,
              scanId,
              evidenceId: detail.evidence.id,
              incidentClass: "contract_upgrade",
              eventType: "proxy_upgraded",
              severityRuleId: detail.evidence.severity.ruleId,
            }],
            evidence: [detail.evidence],
            failures: [],
          });
          const store = new ScanStore();
          store.save(scan);
          const server = await listenForRequests(createApp({
            reader: {},
            config: getTargetProfile(profile.id),
            store,
            publicDirectory: "./public",
          }), 3140);
          try {
            const dashboard = await fetch("http://127.0.0.1:3140/");
            assert.equal(dashboard.status, 200);
            const response = await fetch(`http://127.0.0.1:3140/api/scans/${scanId}/integrity?format=portable`);
            assert.equal(response.status, 200);
            assert.match(response.headers.get("content-type") ?? "", /^application\/json/);
            assert.match(response.headers.get("content-disposition") ?? "", /^attachment; filename="watchtower-scan_[0-9a-f]{64}-portable-integrity\.json"$/);
            const exported = await response.json();
            assert.deepEqual(await verifyPortableIntegrityArtifact(exported).then(({ outcome }) => outcome), "CORROBORATED");

            const fixture = await createPortableArtifact(scan, { declared: "fixture", provenance: "verified-fixture" });
            assert.deepEqual(await verifyPortableIntegrityArtifact(fixture).then(({ outcome }) => outcome), "FIXTURE_ONLY");
            fixture.scanResult.evidence[0].block.number = "1";
            assert.deepEqual(await verifyPortableIntegrityArtifact(fixture).then(({ refusalCode }) => refusalCode), "artifact-id-mismatch");
            console.log("portable compiled smoke assertions passed");
          } finally {
            await new Promise((resolve, reject) => server.close((error) => error ? reject(error) : resolve()));
          }
          EOF
      - name: Start compiled server, check health, and shut down
        env:
          BASE_RPC_URL: http://127.0.0.1:18545
          PORT: "3000"
        run: |
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { spawn } from "node:child_process";
          import net from "node:net";

          const port = 3000;
          const marker = "Watchtower listening at http://localhost:3000";
          const child = spawn(process.execPath, ["--env-file-if-exists=.env", "dist/server/main.js"], {
            env: { ...process.env, BASE_RPC_URL: "http://127.0.0.1:18545", PORT: String(port) },
            stdio: ["ignore", "pipe", "pipe"],
          });
          let stdout = "";
          let stderr = "";
          child.stdout.setEncoding("utf8");
          child.stderr.setEncoding("utf8");
          child.stdout.on("data", (chunk) => { stdout += chunk; });
          child.stderr.on("data", (chunk) => { stderr += chunk; });

          const waitForReadiness = new Promise((resolve, reject) => {
            let settled = false;
            const timer = setTimeout(() => finish(new Error("Compiled Watchtower did not announce readiness within 10 seconds.")), 10_000);
            const finish = (error) => {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              error ? reject(error) : resolve();
            };
            child.stdout.on("data", () => {
              if (stdout.includes(marker)) finish();
            });
            if (stdout.includes(marker)) finish();
            child.once("error", (error) => finish(error));
            child.once("exit", (code, signal) => finish(new Error(`Compiled Watchtower exited before readiness (code=${code}, signal=${signal}).`)));
          });

          try {
            await waitForReadiness;
            const health = await fetch(`http://127.0.0.1:${port}/api/health`);
            assert.equal(health.status, 200);
            assert.equal((await health.json()).status, "ok");
            const dashboard = await fetch(`http://127.0.0.1:${port}/`);
            assert.equal(dashboard.status, 200);
            console.log("Compiled health and dashboard assertions passed.");
            child.kill("SIGTERM");
            const exit = await new Promise((resolve, reject) => {
              child.once("error", reject);
              child.once("exit", (code, signal) => resolve({ code, signal }));
            });
            assert.deepEqual(exit, { code: 0, signal: null });
            const portReleased = await new Promise((resolve, reject) => {
              const probe = net.createServer();
              probe.once("error", reject);
              probe.listen(port, "127.0.0.1", () => probe.close((error) => error ? reject(error) : resolve(true)));
            });
            assert.equal(portReleased, true);
            console.log("Compiled SIGTERM and port-release assertions passed.");
          } catch (error) {
            console.error(stdout);
            console.error(stderr);
            throw error;
          } finally {
            if (child.exitCode === null && child.signalCode === null) child.kill("SIGTERM");
          }
          EOF
