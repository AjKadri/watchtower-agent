name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  production-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install production dependencies and build
        run: |
          npm ci --omit=dev
          npm run build
      - name: Smoke test compiled scan CLI without a live RPC secret
        env:
          BASE_RPC_URL: https://example.invalid
        run: |
          set -euo pipefail
          set +e
          npm run --silent scan > /tmp/watchtower-scan.json 2> /tmp/watchtower-scan.err
          scan_status=$?
          set -e
          if [[ "$scan_status" -ne 1 ]]; then
            cat /tmp/watchtower-scan.err
            cat /tmp/watchtower-scan.json
            echo "::error::Compiled scan CLI returned unexpected status $scan_status."
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync("/tmp/watchtower-scan.json", "utf8"));
            if (result.status !== "failed" || !Array.isArray(result.failures) || result.failures.length === 0) process.exit(1);
          '
          if [[ -s /tmp/watchtower-scan.err ]]; then
            cat /tmp/watchtower-scan.err
            echo "::error::Compiled scan CLI exposed an unexpected stderr failure."
            exit 1
          fi
      - name: Start compiled server, check health, and shut down
        env:
          BASE_RPC_URL: https://example.invalid
          PORT: "3000"
        run: |
          set -euo pipefail
          log_file=/tmp/watchtower-start.log
          node_pid=""
          node_reaped=false

          process_state() {
            ps -o stat= -p "$1" 2>/dev/null | awk 'NR == 1 { print $1 }' || true
          }

          fail_smoke() {
            echo "::error::$1"
            echo "--- $log_file ---"
            cat "$log_file" 2>/dev/null || true
            exit 1
          }

          cleanup() {
            if [[ -n "$node_pid" && "$node_reaped" != "true" ]]; then
              node_state="$(process_state "$node_pid")"
              if [[ -n "$node_state" && "$node_state" != Z* ]]; then
                kill -TERM "$node_pid" 2>/dev/null || true
              fi
              set +e
              wait "$node_pid" 2>/dev/null
              set -e
              node_reaped=true
            fi
          }
          trap cleanup EXIT

          echo "Starting compiled Watchtower directly."
          node --env-file-if-exists=.env dist/server/main.js > "$log_file" 2>&1 &
          node_pid=$!
          echo "Compiled Node PID: $node_pid"

          node_command="$(ps -o args= -p "$node_pid" 2>/dev/null || true)"
          echo "Compiled Node command: ${node_command:-unavailable}"
          if [[ "$node_command" != *"dist/server/main.js"* ]]; then
            fail_smoke "The production process is not the compiled Watchtower entrypoint."
          fi

          echo "Checking GET /api/health for HTTP 200."
          healthy=false
          for _ in {1..30}; do
            if health_code="$(curl --fail --silent --show-error --output /tmp/watchtower-health.json --write-out '%{http_code}' http://127.0.0.1:3000/api/health)"; then
              if [[ "$health_code" == "200" ]]; then
                healthy=true
                break
              fi
            fi
            node_state="$(process_state "$node_pid")"
            if [[ -z "$node_state" || "$node_state" == Z* ]]; then
              fail_smoke "Compiled Watchtower exited before the health check passed."
            fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then
            fail_smoke "GET /api/health did not return HTTP 200."
          fi
          if ! grep -q '"status":"ok"' /tmp/watchtower-health.json; then
            fail_smoke "GET /api/health returned an unexpected response."
          fi
          echo "Health check passed with HTTP $health_code."

          echo "Sending SIGTERM to compiled Node PID $node_pid."
          if ! kill -TERM "$node_pid"; then
            fail_smoke "Could not send SIGTERM to compiled Watchtower."
          fi

          set +e
          wait "$node_pid"
          node_status=$?
          set -e
          node_reaped=true
          echo "Compiled Node wait status: $node_status"
          if [[ "$node_status" -ne 0 ]]; then
            fail_smoke "Compiled Watchtower did not exit cleanly after SIGTERM."
          fi

          echo "Probing port 3000 for release."
          if ! node --input-type=module -e '
            import net from "node:net";
            const probe = net.createServer();
            probe.once("error", () => process.exit(1));
            probe.listen(3000, "127.0.0.1", () => probe.close((error) => process.exit(error ? 1 : 0)));
          '; then
            fail_smoke "Port 3000 remains in use after shutdown."
          fi
          echo "Port 3000 is free."

          node_state="$(process_state "$node_pid")"
          echo "Final compiled Node process state: ${node_state:-absent}"
          if [[ -n "$node_state" && "$node_state" != Z* ]]; then
            fail_smoke "Compiled Watchtower is still running after shutdown."
          fi
          trap - EXIT
